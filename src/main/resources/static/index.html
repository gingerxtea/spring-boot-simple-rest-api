<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yaswanth — Developer Blog</title>

    <!-- Different font for the name -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #073B4C;
            color: #F4FAFA;

            font-family: "Inter", sans-serif;
        }

        .container {
            width: min(900px, 90%);
            margin: auto;
        }

        /* Navigation */

        nav {
            height: 90px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .name {
            font-family: "Playfair Display", serif;
            font-size: 26px;
            font-weight: 500;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        nav a {
            color: #C9E7EA;
            text-decoration: none;
            margin-left: 28px;
            font-size: 14px;
        }

        nav a:hover {
            color: #FFFFFF;
        }

        /* Hero */

        .hero {
            min-height: calc(100vh - 90px);

            display: flex;
            flex-direction: column;
            justify-content: center;

            padding-bottom: 80px;
        }

        .greeting {
            color: #7FD1D9;
            font-size: 15px;
            margin-bottom: 18px;
        }

        h1 {
            max-width: 750px;

            font-size: clamp(42px, 7vw, 72px);
            line-height: 1.05;
            font-weight: 500;

            margin: 0 0 25px;
            letter-spacing: -2px;
        }

        .description {
            max-width: 600px;

            color: #C9E7EA;
            font-size: 18px;
            line-height: 1.7;

            margin-bottom: 35px;
        }

        .links {
            display: flex;
            gap: 25px;
        }

        .links a {
            color: #F4FAFA;
            text-decoration: none;

            padding-bottom: 5px;
            border-bottom: 1px solid #7FD1D9;

            font-size: 15px;
        }

        .links a:hover {
            color: #7FD1D9;
        }

        /* Footer */

        footer {
            position: fixed;
            bottom: 25px;
            left: 0;
            right: 0;

            text-align: center;

            color: #91B9BE;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <nav>
        <div class="name">
            Yaswanth
        </div>

        <div>
            <a href="#">Blog</a>
            <a href="#">About</a>
        </div>
    </nav>

    <main class="hero">

        <div class="greeting">
            Hello, I'm Yaswanth.
        </div>

        <h1>
            Building things,<br>
            learning along the way.
        </h1>

        <p class="description">
            Welcome to my little corner of the internet.
            I write about software, technology, projects,
            and the lessons I pick up while building.
        </p>

        <div class="links">
            <a href="#">Read the blog →</a>
            <a href="#">About me →</a>
        </div>

    </main>

</div>

<footer>
    © 2026 · Built with curiosity.
</footer>

</body>
</html>
